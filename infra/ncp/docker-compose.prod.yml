services:
  api:
    image: ${CLIMAX_IMAGE:-climax-backend:latest}
    container_name: climax-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: INFO

      # DB 는 2026-09-11 부터 별도 서버(lbs-climax-db, 10.30.10.205). .env.prod 의 DB_HOST/DB_PASSWORD 로 지정.
      # 되돌리려면 .env.prod 에서 DB_HOST=postgres, DB_PASSWORD=$POSTGRES_PASSWORD 로 두면 된다.
      DATABASE_URL: postgresql+asyncpg://climax:${DB_PASSWORD:-${POSTGRES_PASSWORD}}@${DB_HOST:-postgres}:5432/climax
      REDIS_URL: redis://redis:6379/0
      # 건물 원천: db = PostGIS bldg_poly(2026-09-11 채택, 80점 0.121/-0.001/r0.40 — 파일과 동일·미세 개선),
      # file = 로컬 타일 JSON(폴백). 전국/일본은 디스크·메모리 때문에 db 만 가능.
      BUILDING_SOURCE: ${BUILDING_SOURCE:-file}

      GOOGLE_STREETVIEW_API_KEY: ${GOOGLE_STREETVIEW_API_KEY}
      GOOGLE_STREETVIEW_SIGNING_SECRET: ${GOOGLE_STREETVIEW_SIGNING_SECRET:-}
      # 거리뷰 월 이미지 상한 (1지점=5장). 구글 무료 10,000장 · 초과 1,000장당 $7.
      # 30,000장 = 월 6,000 신규 지점, 최악의 경우 약 20만원.
      # ⚠️ 실제 과금은 구글 콘솔에 결제수단이 등록돼 있어야 발생한다.
      #    없으면 구글이 무료 한도에서 스스로 멈춘다(= 여기 값과 무관하게 안전).
      # ⚠️ 0 이하로 두지 말 것 — 요금뿐 아니라 약관 3.2.3(a)(ii) '대량 다운로드'로
      #    읽힐 트래픽까지 열린다. 계정 정지는 요금보다 치명적이다.
      STREETVIEW_MONTHLY_IMAGE_BUDGET: ${STREETVIEW_MONTHLY_IMAGE_BUDGET:-30000}
      NCP_MAPS_CLIENT_ID: ${NCP_MAPS_CLIENT_ID}
      NCP_MAPS_CLIENT_SECRET: ${NCP_MAPS_CLIENT_SECRET}
      KMA_API_KEY: ${KMA_API_KEY}
      KMA_APIHUB_KEY: ${KMA_APIHUB_KEY:-}
      # 목적지 장소(상호) 검색 + 지도 탭 지점 이름 — 카카오 로컬
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      VWORLD_API_KEY: ${VWORLD_API_KEY:-}
      BUILDING_API_KEY: ${BUILDING_API_KEY:-}
      # Mapillary(우선 원천) — CC BY-SA, 저장·학습 합법. ENABLED=true 여야 라이브 사용
      MAPILLARY_ACCESS_TOKEN: ${MAPILLARY_ACCESS_TOKEN:-}
      MAPILLARY_ENABLED: ${MAPILLARY_ENABLED:-false}
      # 현장 대조 도구 접근키 (2026-08-16, 대표 전용) — 없으면 /field/check 404
      FIELD_KEY: ${FIELD_KEY:-}
      # Sentinel-2 NDVI(식생 GVI) — Copernicus Data Space Sentinel Hub OAuth
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID:-}
      SENTINEL_CLIENT_SECRET: ${SENTINEL_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      NCP_OBJECT_ACCESS_KEY: ${NCP_OBJECT_ACCESS_KEY:-}
      NCP_OBJECT_SECRET_KEY: ${NCP_OBJECT_SECRET_KEY:-}
      NCP_OBJECT_BUCKET: ${NCP_OBJECT_BUCKET:-climax-mvp}

      SEGFORMER_MODEL_NAME: ${SEGFORMER_MODEL_NAME:-nvidia/segformer-b0-finetuned-ade-512-512}
      SEGFORMER_DEVICE: ${SEGFORMER_DEVICE:-cpu}

      # 쾌적경로 데모는 앱 번들 안에서 file:// 로 떠서 Origin 이 "null" 이다.
      # 여기 없으면 앱에서 장소검색 fetch 가 CORS 로 막힌다.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://climaxapp.kr,https://www.climaxapp.kr,null}
    ports:
      - "8000:8000"
    volumes:
      # 모델 가중치 영구 보존 (컨테이너 재시작해도 재다운로드 안 함)
      - hf_cache:/app/.cache/huggingface
      # 개념도(개선 시뮬 이미지) 캐시 — 같은 격자·개입은 다시 생성하지 않는다
      - concept_cache:/app/.cache/concept
      # 사전적재 건물 타일(전세계 파일럿) — 호스트 git 저장소를 그대로 마운트.
      # 도시 추가 시 git pull + 컨테이너 재시작만으로 반영(이미지 재빌드 불필요).
      - ../../backend/data/buildings:/app/data/buildings:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: climax-redis
    restart: unless-stopped
    # 2026-09-08 변경 — 거리뷰 분석 캐시 보호
    #  · allkeys-lru 였을 때: 메모리가 차면 TTL 없는 파노라마 분석 결과까지 지워졌다.
    #    지워진 좌표는 캐시 미스가 나서 구글에 재요청 → 재과금된다(9월 실측 18만원 규모).
    #  · volatile-lru: TTL 이 걸린 키(날씨·기상 캐시)만 제거 대상. 파노라마 분석은 보존.
    #  · appendonly: 서버가 강제 종료돼도 최대 1초치만 손실.
    command: >
      redis-server --maxmemory 512mb --maxmemory-policy volatile-lru
      --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: climax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: climax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: climax
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climax"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  postgres_data:
  hf_cache:
  concept_cache:

networks:
  default:
    name: climax-net
