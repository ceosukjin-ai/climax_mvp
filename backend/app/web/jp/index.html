<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0f1720"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ClimaX"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="apple-touch-icon" href="./icon.svg"/>
<title>ClimaX — いま、ここの体感</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#0f1720; --panel:#182430; --line:#2a3a49; --txt:#eaf1f7; --muted:#9fb3c4;
    --safe:#2e9e6b; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Apple SD Gothic Neo","Segoe UI",sans-serif}
  #map{position:absolute;inset:0}
  .leaflet-container{background:#0b1219}
  .leaflet-control-zoom{display:none}
  .hdr{position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;
       padding:calc(10px + var(--sat)) 14px 10px;background:linear-gradient(180deg,rgba(15,23,32,.95),rgba(15,23,32,0));pointer-events:none}
  .hdr b{font-size:15px;letter-spacing:.2px}
  .hdr small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
  .lang{pointer-events:auto;display:flex;gap:4px}
  .lang button{font:inherit;font-size:11.5px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);
       background:rgba(24,36,48,.9);color:var(--muted);cursor:pointer}
  .lang button.on{color:var(--txt);border-color:#4d7fa8;background:#1d3346}
  .fab{position:absolute;z-index:1000;right:14px;bottom:calc(16px + var(--sab));width:46px;height:46px;border-radius:50%;
       border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:20px;display:flex;align-items:center;justify-content:center;
       box-shadow:0 6px 20px rgba(0,0,0,.4);cursor:pointer}
  .fab.on{border-color:#4d7fa8;color:#7fb6e6}
  .fab2{bottom:calc(70px + var(--sab));font-size:20px}
  .fab3{bottom:calc(124px + var(--sab));font-size:20px}
  .fab4{bottom:calc(178px + var(--sab));font-size:20px}
  .navstart{width:100%;margin:9px 0 2px;padding:10px;border-radius:10px;border:1px solid #2e9e6b66;
       background:#2e9e6b1a;color:#2e9e6b;font-size:13.5px;font-weight:600;cursor:pointer}
  .navbar{position:absolute;z-index:1200;left:10px;right:10px;top:calc(8px + var(--sat));
       max-width:460px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
       border-radius:14px;padding:11px 13px;box-shadow:0 10px 40px rgba(0,0,0,.5);display:none}
  .navbar.on{display:block}
  .navbar .ar{font-size:30px;line-height:1;float:left;margin-right:11px}
  .navbar .t1{font-size:15px;font-weight:600}
  .navbar .t2{font-size:12px;color:var(--muted);margin-top:2px}
  .navbar .x{position:absolute;top:6px;right:9px;border:none;background:transparent;
       color:var(--muted);font-size:16px;cursor:pointer}
  /* 주변 장소 (2026-09-13). 관광객은 가려는 가게가 지도 어디인지 모른다 →
     목적지를 고를 방법이 필요하다. 정렬은 거리순 — 쾌적함은 '그 길을 어떻게 갈지'의 문제다. */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
  .chips button{flex:0 0 auto;padding:5px 10px;border-radius:14px;border:1px solid var(--line);
       background:transparent;color:var(--muted);font-size:12.5px;cursor:pointer}
  .chips button.on{border-color:#4d7fa8;color:#7fb6e6}
  .plist{max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .prow{display:flex;align-items:center;gap:9px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer}
  .prow:first-child{border-top:none}
  .prow .ic{width:22px;text-align:center;font-size:15px}
  .prow .nm{flex:1;font-size:13.5px;line-height:1.35}
  .prow .nm small{color:var(--muted);font-size:11.5px}
  .prow .di{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .poiPin{font-size:13px;line-height:18px;text-align:center;text-shadow:0 0 3px #000,0 0 6px #000;opacity:.92}
  .wb{display:flex;align-items:baseline;gap:6px;margin:-4px 0 8px;font-size:12.5px;color:var(--muted)}
  .wb b{font-size:16px;color:var(--txt)}
  .paw{border-radius:12px;padding:8px 11px;margin:0 0 10px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 10px}
  .cmp div{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .cmp .t{font-size:11.5px;color:var(--muted)} .cmp .m{font-size:15px;font-weight:700}
  .cmp .s{font-size:11.5px;color:var(--muted);margin-top:2px}
  .sheet{position:absolute;z-index:1000;left:10px;right:10px;bottom:calc(10px + var(--sab));max-width:420px;margin:0 auto;
       background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px 12px;box-shadow:0 10px 40px rgba(0,0,0,.5);
       transition:transform .25s ease}
  .sheet.hidden{transform:translateY(130%)}
  /* 넓은 화면(데스크톱)에서는 가운데가 아니라 **왼쪽 아래**에 둔다 (2026-09-13).
     가운데에 있으면 경로 한복판을 덮어 지도를 못 본다. 폰에서는 기존대로 하단 전체. */
  @media (min-width: 700px){
    .sheet{left:14px;right:auto;margin:0;width:380px;max-width:380px}
  }
  /* 시트를 접을 수 있게 (2026-09-12). 한 번 뜨면 지도를 덮어 경로가 안 보였다.
     손잡이를 누르거나 아래로 쓸면 접히고, 다시 누르면 펴진다. */
  .sheet .grip{position:absolute;top:6px;left:50%;transform:translateX(-50%);
       width:44px;height:5px;border-radius:3px;background:#6b7a88;cursor:pointer}
  .sheet .xbtn{position:absolute;top:4px;right:8px;width:26px;height:26px;border:none;
       background:transparent;color:var(--muted);font-size:17px;line-height:26px;cursor:pointer}
  .sheet{padding-top:18px}
  .sheet .body{transition:opacity .18s ease}
  .sheet.mini{padding-bottom:10px}
  .sheet.mini .body{display:none}
  .sheet.mini .peek{display:block}
  .sheet .peek{display:none;font-size:13px;color:var(--muted);text-align:center;padding:2px 0 0}
  .feel{display:flex;align-items:baseline;gap:8px}
  .feel .n{font-size:46px;font-weight:700;line-height:1}
  .feel .u{font-size:14px;color:var(--muted)}
  .badge{display:inline-block;margin-top:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:700}
  .sub{margin:6px 0 10px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .act{border-radius:12px;padding:10px 12px;margin:2px 0 10px;font-size:14px;line-height:1.55;font-weight:600}
  .act small{display:block;font-weight:400;font-size:12.5px;opacity:.85;margin-top:3px}
  .rows{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
  .row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-top:1px solid var(--line)}
  .row .k{color:var(--muted)} .row .v{font-weight:600}
  .foot{margin-top:9px;font-size:10.5px;color:var(--muted);line-height:1.5;display:flex;justify-content:space-between;gap:8px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--muted);border-top-color:transparent;
        border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  .hint{position:absolute;z-index:900;left:50%;top:calc(64px + var(--sat));transform:translateX(-50%);background:rgba(24,36,48,.92);
        border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .me{width:18px;height:18px;border-radius:50%;background:#4d9be6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(77,155,230,.25)}
</style>
</head>

function actionFor(d){
  const t=T().act;
  const dir = (d.stress_direction==="cold")?"cold":"heat";
  const key = d.risk==="safe" ? "heat_safe" : `${dir}_${d.risk}`;
  const a = t[key] || t.heat_safe;
  let extra="";
  if(dir==="heat" && d.risk!=="safe" && d.exposure && /볕|sun/i.test(d.exposure)) extra=t.shade_tip;
  return {h:a[0], s:a[1], extra};
}
function expLabel(d){ if(!d.exposure) return ""; return /그늘|shade/i.test(d.exposure)?T().shade:T().sun; }

function loading(la,lo){
  sheet.classList.remove('hidden');
  setSheet(`<div style="font-size:13px;color:var(--muted)"><span class="spin"></span>${T().calc}<br>
    <span style="font-size:11px">${la.toFixed(4)}, ${lo.toFixed(4)}</span></div>`);
}
function show(d){
  lastData=d;
  const c=colorFor(d), a=actionFor(d), t=T();
  const feel = (d.pet_ai!=null && d.ai_applied) ? d.pet_ai : d.vpti;   // AI 보정이 켜졌으면 그 값(형태 기반), 아니면 물리
  sheet.classList.remove('hidden');
  setSheet(`
    <div class="feel"><span class="n" style="color:${c}">${Math.round(feel)}</span><span class="u">${t.feel}</span>
      <span class="badge" style="margin-left:auto;background:${c}22;color:${c};border:1px solid ${c}55">${t.risk[d.risk]||d.risk}</span></div>
    <div class="sub">${expLabel(d)} · ${t.svf} ${Math.round(d.svf*100)}% · ${t.gvi} ${Math.round((d.gvi||0)*100)}%${d.street_width_m?` · ${d.street_width_m}m`:""}</div>
    ${wbgtRow(d)}
    ${pawCard(d)}
    <div class="act" style="background:${c}1a;border:1px solid ${c}44;color:${c}">${a.h}<small style="color:var(--txt)">${a.s}${a.extra?`<br>${a.extra}`:""}</small></div>
    <div class="rows">
      <div class="row"><span class="k">${t.ta}</span><span class="v">${d.weather.ta}°C</span></div>
      <div class="row"><span class="k">${t.mrt}</span><span class="v">${d.mrt_c}°C</span></div>

}
// 시트 내용을 갈아끼우면서 손잡이와 접힘 상태를 유지한다 (2026-09-12).
let sheetMini=false;
function setSheet(html){
  sheet.innerHTML = '<div class="grip"></div><button class="xbtn" title="close">✕</button>'
                  + '<div class="peek">' + T().peek + '</div>'
                  + '<div class="body">' + html + '</div>';
  sheet.classList.toggle('mini', sheetMini);
  sheet.querySelector('.grip').onclick = (ev)=>{ ev.stopPropagation(); toggleMini(); };
  sheet.querySelector('.xbtn').onclick = (ev)=>{ ev.stopPropagation(); sheet.classList.add('hidden'); };
}
function toggleMini(v){
  sheetMini = (v===undefined) ? !sheetMini : !!v;
  sheet.classList.toggle('mini', sheetMini);
}
// 아래로 쓸면 접히고 위로 쓸면 펴진다
(function(){
  let y0=null;
  sheet.addEventListener('touchstart',e=>{ y0=e.touches[0].clientY; },{passive:true});
  sheet.addEventListener('touchend',e=>{
    if(y0===null) return;
    const dy=e.changedTouches[0].clientY-y0; y0=null;
    if(dy>28) toggleMini(true); else if(dy<-28) toggleMini(false);
  },{passive:true});
})();

// 위치 권한/GPS 오류는 커버리지 문제가 아니다 (2026-09-13).
// 예전엔 둘을 같은 창에 띄워 "이 지역은 아직 준비 안 됨 / User denied Geolocation" 이
// 나왔다 — 사용자가 커버리지 밖이라고 오해한다.
function geoerr(code){
  const t=T();
  const m = code===1 ? t.gpsDenied : code===2 ? t.gpsUnavail : code===3 ? t.gpsTimeout : t.gpsDenied;
  sheet.classList.remove('hidden');
  setSheet('<div style="font-size:14px;font-weight:600;margin-bottom:5px">'+t.gpsTitle+'</div>'
    +'<div style="font-size:12.5px;color:var(--muted);line-height:1.55">'+m+'</div>');
}
function nocov(msg){
  sheet.classList.remove('hidden');
  setSheet(`<div style="font-size:14px;font-weight:600;margin-bottom:5px">${T().nocov}</div>
    <div style="font-size:12.5px;color:var(--muted);line-height:1.5">${msg||T().nocov2}</div>`);
}

async function query(la,lo){
  if(marker) marker.remove();
  marker=L.circleMarker([la,lo],{radius:8,color:"#fff",weight:2,fillColor:"#4d7fa8",fillOpacity:.9}).addTo(map);
  loading(la,lo);
  if(inflight) inflight.abort();
  inflight=new AbortController();
  try{
    const res=await fetch(`${API}?lat=${la.toFixed(5)}&lon=${lo.toFixed(5)}`,{signal:inflight.signal});
    if(res.status===404){ nocov(); return; }
    if(!res.ok){ nocov(T().err); return; }
    const d=await res.json();
    if(!d.ok){ nocov(); return; }
    marker.setStyle({fillColor:colorFor(d)});
    show(d); lastQ={la,lo,t:Date.now()};
  }catch(e){ if(e.name!=="AbortError") nocov(T().err); }
}
map.on('click',e=>{
  toggleMini(true);          // 지도를 보려는 동작이다 — 시트를 비켜준다
  if(dogLayers.length){      // 강아지 코스가 떠 있으면 누른 자리에서 다시 짠다
    dogOrigin={la:e.latlng.lat, lo:e.latlng.lng};
    toggleMini(false); loadDog(); return;
  }
  if(routeMode){
    if(!rFrom) setFrom(e.latlng.lat,e.latlng.lng);          // 1번째 탭 — 출발
    else routeTo(e.latlng.lat,e.latlng.lng);                // 2번째 탭 — 도착
    return;
  }
  follow=false; fab.classList.remove('on'); hint.textContent=T().hint; query(e.latlng.lat,e.latlng.lng);
});

// ─── 현재 위치 따라가기: 30m 이상 이동 또는 10분 경과 시 재계산 ───
function distM(a,b,c,d){const R=6371000,p=Math.PI/180;const x=(c-a)*p,y=(d-b)*p*Math.cos((a+c)/2*p);return Math.sqrt(x*x+y*y)*R;}
let watchId=null;
function startFollow(){
  if(!navigator.geolocation){ geoerr(2); return; }
  follow=true; fab.classList.add('on'); hint.textContent=T().follow;
  watchId=navigator.geolocation.watchPosition(p=>{
    const la=p.coords.latitude, lo=p.coords.longitude;
    if(!meMarker){ meMarker=L.marker([la,lo],{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map); map.setView([la,lo],17); }
    else meMarker.setLatLng([la,lo]);
    if(follow) map.panTo([la,lo],{animate:true});
    const stale = !lastQ || distM(lastQ.la,lastQ.lo,la,lo)>30 || (Date.now()-lastQ.t)>600000;
    if(follow && stale && (p.coords.accuracy||99)<60) query(la,lo);
  },err=>{ follow=false; fab.classList.remove('on'); hint.textContent=T().hint; geoerr(err.code); },
  {enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}
fab.onclick=()=>{ if(follow){ follow=false; fab.classList.remove('on'); hint.textContent=T().hint; if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;} } else startFollow(); };


// ─── WBGT(暑さ指数) · 노면(강아지) ──────────────────────
// 일본은 체감더위를 WBGT 로 말한다(환경성 기준). 우리 값은 이 좌표의 MRT 에서 나오므로
// 같은 거리라도 볕/그늘이 다르게 나온다 — 관측점 단위 공식값이 못 하는 구분이다.
const WBC={safe:"#2e9e6b",attention:"#e8c14a",warning:"#e07b39",severe:"#d9483b",danger:"#a01f14"};
function wbgtRow(d){
  if(d.wbgt==null) return "";
  const lv=d.wbgt_level||{}, c=WBC[lv.code]||"#8899a6", label=lv[L_]||lv.en||"";
  const alert = lv.alert==="special" ? "🚨" : (lv.alert==="alert" ? "⚠️" : "");
  return `<div class="wb"><span>${T().wbgt}</span><b style="color:${c}">${d.wbgt}</b>
    <span style="color:${c};font-weight:600">${label} ${alert}</span></div>`;
}
const PAWC={ok:"#2e9e6b",hot:"#e8c14a",burn:"#e07b39",danger:"#d9483b"};
function pawCard(d){
  if(d.ground_c==null||!d.paw_risk||d.paw_risk.code==="ok") return "";
  const c=PAWC[d.paw_risk.code]||"#8899a6", msg=d.paw_risk[L_]||d.paw_risk.en;
  return `<div class="paw" style="background:${c}1a;border:1px solid ${c}44;color:${c}">🐾
    <span>${T().pawT} · ${T().paw} ${Math.round(d.ground_c)}°C — ${msg}</span></div>`;
}

// ─── 日陰ルート: 출발(현재 조회지점) → 목적지(탭) ─────────
// 산책 코스와 **같은 비용 함수**를 쓰고 모양만 편도다. 최단 경로를 나란히 보여주는 이유:
// "14초 더 걸으면 그늘 1.5배" 라는 비교가 있어야 사람이 실제로 길을 바꾼다.
const ROUTE_API="/api/v1/route/shade";
// 출발지 지정 방식 변경 (2026-09-12): 예전에는 출발지가 "경로 모드 켜기 직전에 조회한 점"으로
// 고정돼, 바꾸려면 모드를 껐다 → 새 점 탭(3초 대기) → 다시 켜야 했다. 네 단계였다.
// 이제 경로 모드 안에서 첫 탭=출발, 둘째 탭=도착, 셋째 탭=처음부터. 출발 탭은 VPTI 조회를
// 하지 않으므로 즉시 반응한다 — 출발지는 경로 계산에 좌표만 필요하다.
let routeMode=false, rLayers=[], rFrom=null, rFromMarker=null, lastRoute=null;
// 이동수단 (2026-09-16). 일본은 자전거 통근·통학이 흔하다(全国 약 1,300만대 통근 이용).
// 걷기와 물리가 다르다: 시속 15 km 면 **상대풍 4.2 m/s** 가 항상 불고(체감 하강),
// 대신 대사량이 4.5 MET 로 올라간다(열 생성 증가). 둘이 상쇄되지 않으므로 값이 달라진다.
// 버튼을 새로 만들지 않고 🚶→🚲→끄기 로 순환시킨다 — 화면 오른쪽이 이미 버튼 4개다.
let travelMode="walk";
function modeIcon(){ routeBtn.textContent = !routeMode ? "\u{1F6B6}" : (travelMode==="bike" ? "\u{1F6B2}" : "\u{1F6B6}"); }
// 경유지 안내를 하려면 **원래 출발·도착**을 들고 있어야 한다 (2026-09-13).
// 예전엔 가게를 누르면 그 가게가 새 목적지가 돼서 원래 가려던 곳이 사라졌다.
let rOrigin=null, rDest=null, baseRoute=null;
const routeBtn=document.getElementById('routeBtn');
function clearRoutes(){ rLayers.forEach(l=>l.remove()); rLayers=[]; lastRoute=null; }
function clearFrom(){ if(rFromMarker){ rFromMarker.remove(); rFromMarker=null; } rFrom=null; }
function routeHint(){
  hint.textContent = !routeMode ? (follow?T().follow:T().hint)
                   : (rFrom ? T().rTo : T().rFrom);
}
function setRouteMode(on){
  routeMode=on; routeBtn.classList.toggle('on',on);
  if(!on){ clearRoutes(); clearFrom(); }
  modeIcon();
  routeHint();
}
function setFrom(la,lo){
  clearRoutes(); clearFrom();
  rFrom={la,lo};
  rFromMarker=L.circleMarker([la,lo],{radius:7,color:"#fff",weight:2,
    fillColor:"#4d7fa8",fillOpacity:.95}).addTo(map);
  sheet.classList.add('hidden');
  routeHint();
}
routeBtn.onclick=()=>{
  if(!routeMode){ travelMode="walk"; setRouteMode(true); }
  else if(travelMode==="walk"){ travelMode="bike"; clearRoutes(); routeHint(); }
  else { travelMode="walk"; setRouteMode(false); }
  modeIcon();
};

function drawRoute(r,color,dash,w){
  if(!r||!r.coords) return null;
  const ll=r.coords.map(p=>[p.lat,p.lon]);
  const line=L.polyline(ll,{color,weight:w,opacity:.9,dashArray:dash}).addTo(map);
  rLayers.push(line); return line;
}

// 구간별 노면온도로 색을 매긴다 (2026-09-12).
// 요약 한 줄("노면 30°C")은 최고값이라 어느 골목이 뜨거운지 알려주지 않는다.
// 그늘 구간은 파랑, 뙤약볕은 주황~빨강. 경계는 강아지 발 화상 기준(50℃)에 맞춰 잡았다.
// 색은 **체감기후(PET)** 기준. 노면온도가 아니다 — 사람이 느끼는 값으로 칠해야
// "어느 길로 갈까"에 답이 된다. PET 가 없으면(야간 계산 실패 등) 노면온도로 물러난다.
// 경계는 PET 열스트레스 등급(Matzarakis)에 맞췄다: 29 더움 / 35 매우더움 / 41 극심.
function petColor(pet){
  if(pet>=41) return "#c0392b";
  if(pet>=35) return "#e8641c";
  if(pet>=29) return "#eb9a1e";
  if(pet>=23) return "#d9c024";
  if(pet>=18) return "#2e9e6b";
  if(pet>=9)  return "#2e7fb8";
  return "#4a5db8";
}
function segColor(sg){
  if(sg.pet!=null) return petColor(sg.pet);
  if(sg.shaded) return "#2e7fb8";
  if(sg.ts>=50) return "#e8641c";
  if(sg.ts>=40) return "#d9c024";
  return "#2e9e6b";
}
function drawSegments(r){
  if(!r||!r.coords||!r.segments||!r.segments.length) return false;
  const t=T();
  r.segments.forEach(sg=>{
    const a=r.coords[sg.i], b=r.coords[sg.i+1];
    if(!a||!b) return;
    const seg=L.polyline([[a.lat,a.lon],[b.lat,b.lon]],
      {color:segColor(sg),weight:7,opacity:.95,lineCap:"butt"}).addTo(map);
    const expo = sg.night ? t.night : (sg.shaded?t.shade:t.sun);
    const feel = sg.pet!=null ? `${t.feelS} ${Math.round(sg.pet)}°C · ` : "";
    // **왜** 그늘인지를 밝힌다. 색만 보여주면 "왜 여기가 초록이냐"에 답할 수 없다.
    const why = sg.night ? "" : (t.why[sg.why] ? " — " + t.why[sg.why] : "");
    const surf = sg.surface ? (t.surf[sg.surface] || sg.surface) : "";
    seg.bindTooltip(
      `${t.rSeg} · ${expo}${why}<br>${feel}${t.paw} ${Math.round(sg.ts)}°C`
      + (surf ? ` (${surf}${sg.known===false?t.surfGuess:""})` : "")
      + ` · ${Math.round(sg.m)}m`,
      {sticky:true});
    rLayers.push(seg);
  });
  return true;
}
function showRoute(d){
  const t=T(), c=d.comfort, sh=d.shortest, g=d.gain||{};
  const pct=v=>Math.round((v||0)*100), mn=v=>Math.max(1,Math.round((v||0)/60));
  const bike = travelMode==="bike";
  const nmShade = bike ? t.rShadeB : t.rShade;
  const nmGain  = bike ? t.rGainB  : t.rGain;
  // 자전거도로 비율은 **표시만** 한다 (2026-09-16).
  // 레인이 얼마나 쾌적한지에 대한 연구 근거가 없어 비용에 넣지 않았다. 사실만 보여준다.
  const bl = (bike && c.bike_lane_ratio!=null)
    ? `<div style="font-size:11.5px;color:var(--muted);margin-top:5px">\u{1F6B2} ${t.bLane} ${pct(c.bike_lane_ratio)}% · ${t.bSide} ${pct(c.bike_sidewalk_ratio)}% <span style="opacity:.75">· ${t.bikeNote}</span></div>` : "";
  // 그늘 이득이 0 이하면 "더 걸으면 그늘"이라고 말하지 않는다 (2026-09-13).
  // 예전에는 `+57s · 더 걸으면 그늘이 0% → 0%` 처럼, 이득이 없는데 돌아가라고 권했다.
  const same = (g.same === true) || ((g.shade_ratio_gain || 0) <= 0);
  const head = same ? `<div class="act" style="background:#8899a61a;border:1px solid #8899a644">${t.rCmpNote}</div>`
    : `<div class="act" style="background:#2e9e6b1a;border:1px solid #2e9e6b44;color:#2e9e6b">
         +${Math.max(0,g.extra_seconds||0)}s · ${nmGain} ${pct(sh.shade_ratio)}% → ${pct(c.shade_ratio)}%
         <small style="color:var(--txt)">${t.shadeW} ${pct(g.shade_ratio_gain)}%p ↑</small></div>`;
  sheet.classList.remove('hidden');
  setSheet( head + `
    <div class="cmp">
      <div style="border-color:#2e9e6b66"><div class="t">${nmShade}</div>
        <div class="m">${mn(c.seconds)}分 · ${c.meters}m</div>
        <div class="s">${t.shadeW} ${pct(c.shade_ratio)}% · ${t.paw} ${Math.round(c.max_surface_temp_c)}°C</div></div>
      <div><div class="t">${t.rShort}</div>
        <div class="m">${mn(sh.seconds)}分 · ${sh.meters}m</div>
        <div class="s">${t.shadeW} ${pct(sh.shade_ratio)}% · ${t.paw} ${Math.round(sh.max_surface_temp_c)}°C</div></div>
    </div>` + bl + `
    <button id="navBtn" class="navstart">🧭 ${t.navStart}</button>
    <div class="foot"><span>${t.foot}</span><span>${d.weather?`${d.weather.ta}°C`:""}</span></div>
    <div style="display:flex;gap:6px;align-items:center;margin-top:7px;font-size:11px;color:var(--muted)">
      <span>${t.feelS}</span>
      <span style="width:13px;height:4px;border-radius:2px;background:#2e7fb8"></span>~18
      <span style="width:13px;height:4px;border-radius:2px;background:#2e9e6b"></span>23
      <span style="width:13px;height:4px;border-radius:2px;background:#d9c024"></span>29
      <span style="width:13px;height:4px;border-radius:2px;background:#eb9a1e"></span>35
      <span style="width:13px;height:4px;border-radius:2px;background:#e8641c"></span>41°C+
      <span style="width:13px;height:4px;border-radius:2px;background:#c0392b"></span>
      <span style="opacity:.7">${t.approx}</span>
    </div>`);
}
async function routeTo(la,lo){
  const from = rFrom || lastQ
            || (meMarker ? {la:meMarker.getLatLng().lat, lo:meMarker.getLatLng().lng} : null);
  if(!from){ routeHint(); return; }
  rOrigin={la:from.la, lo:from.lo}; rDest={la,lo};
  clearRoutes();
  sheet.classList.remove('hidden');
  setSheet(`<div style="font-size:13px;color:var(--muted)"><span class="spin"></span>${T().rCalc}</div>`);
  try{
    const q=`from_lat=${from.la.toFixed(5)}&from_lon=${from.lo.toFixed(5)}&to_lat=${la.toFixed(5)}&to_lon=${lo.toFixed(5)}&mode=${travelMode}`;
    const res=await fetch(`${ROUTE_API}?${q}`);
    const d=await res.json();
    if(!d.ok||!d.comfort){ nocov(d.reason||T().rFail); return; }
    lastRoute = d.comfort; baseRoute = d.comfort;
    drawRoute(d.shortest,"#8899a6","6 6",4);
    if(!drawSegments(d.comfort)) drawRoute(d.comfort,"#2e9e6b",null,6);
    const b=L.latLngBounds(d.comfort.coords.map(p=>[p.lat,p.lon]));
    rLayers.push(L.circleMarker([la,lo],{radius:7,color:"#fff",weight:2,fillColor:"#2e9e6b",fillOpacity:.95}).addTo(map));
    map.fitBounds(b,{padding:[40,120]});
    showRoute(d);
    toggleMini(false);
    clearFrom();                 // 다음 탭은 새 출발지 — 세 번째 탭이 곧 초기화다
    hint.textContent=T().rRedo;
  }catch(e){ nocov(T().rFail); clearFrom(); routeHint(); }
}

// ─── 주변 장소 → 목적지 고르기 (2026-09-13) ──────────────────
// 그늘 경로는 A→B 로 이미 되지만, 관광객은 **가려는 가게가 지도 어디인지 모른다.**
// 목적지를 찍을 방법이 없어 기능이 닿지 않았다. 주변에 뭐가 있는지 보여주고 하나 고르면
// 그 지점을 목적지로 넘긴다. 정렬은 **거리순** — 사람은 갈 곳을 먼저 정하고,
// 쾌적함은 그 길을 어떻게 갈지의 문제다. 출처: © OpenStreetMap contributors
const POI_API="/api/v1/poi/near";
const POI_ALONG="/api/v1/poi/along";
const POI_ICON={food:"🍜",cafe:"☕",bar:"🍺",see:"⛩",shop:"🏪",util:"🚰"};
const POI_TABS=[
  {k:"restaurant,cafe", t:{ja:"食事",en:"Food",ko:"식사"}},
  {k:"attraction,shrine,park", t:{ja:"観光",en:"See",ko:"관광"}},
  {k:"convenience", t:{ja:"コンビニ",en:"Shop",ko:"편의점"}},
  {k:"toilets,water,vending", t:{ja:"水分・トイレ",en:"Water·Toilet",ko:"물·화장실"}},
];
let poiLayers=[], poiTab=0, poiBusy=false;
const poiBtn=document.getElementById('poiBtn');
function clearPoi(){ poiLayers.forEach(l=>l.remove()); poiLayers=[]; }
function poiOrigin(){
  if(rFrom) return rFrom;
  if(lastQ) return {la:lastQ.la, lo:lastQ.lo};
  if(meMarker) return {la:meMarker.getLatLng().lat, lo:meMarker.getLatLng().lng};
  const c=map.getCenter(); return {la:c.lat, lo:c.lng};
}
// 가게를 **경유지**로 끼워 넣는다: 출발 → 가게 → 원래 도착지.
// 두 구간을 각각 그늘 경로로 받아 이어 붙인다 — 들르는 길도 쾌적해야 하기 때문이다.
// 원래 경로가 없으면(경로를 아직 안 그렸으면) 그 가게를 목적지로 삼는다.
async function poiVia(la,lo,name){
  if(!(rOrigin && rDest)){
    if(!routeMode) setRouteMode(true);
    if(!rFrom){ const o=poiOrigin(); setFrom(o.la,o.lo); }
    return routeTo(la,lo);
  }
  const t=T();
  clearPoi(); clearRoutes();
  sheet.classList.remove('hidden');
  setSheet('<div style="font-size:13px;color:var(--muted)"><span class="spin"></span>'+t.rCalc+'</div>');
  // 호출 한 번으로 바꿨다 (2026-09-16). 예전엔 A→가게, 가게→B 를 따로 불렀는데
  // 그러면 **도로망 조회·스카이라인 격자·그래프 구성**이 전부 두 번 돌았다(가장 무거운 셋).
  // 서버가 같은 그래프 위에서 이어 붙이고 via_index 로 경유 지점을 알려준다.
  const q='from_lat='+rOrigin.la.toFixed(5)+'&from_lon='+rOrigin.lo.toFixed(5)
         +'&to_lat='+rDest.la.toFixed(5)+'&to_lon='+rDest.lo.toFixed(5)
         +'&via_lat='+la.toFixed(5)+'&via_lon='+lo.toFixed(5)+'&mode='+travelMode;
  try{
    const d=await fetch(ROUTE_API+'?'+q).then(r=>r.json());
    const r=d&&d.comfort;
    if(!r){ nocov(t.rFail); return; }
    // 합친 경로를 그리고, via_index 로 앞/뒤 구간 통계만 나눈다.
    drawSegments(r) || drawRoute(r,"#2e9e6b",null,6);
    const vi = (r.via_index!=null) ? r.via_index : Math.floor((r.coords.length-1)/2);
    const legStat=(i0,i1)=>{
      let m=0, sm=0;
      (r.segments||[]).forEach(sg=>{ if(sg.i>=i0 && sg.i<i1){ m+=sg.m; if(sg.shaded) sm+=sg.m; } });
      return {meters:Math.round(m), shade_ratio:m>0?sm/m:0,
              seconds:Math.round((r.seconds||0)*(r.meters?m/r.meters:0))};
    };
    const a=legStat(0,vi), b=legStat(vi,r.coords.length-1);
    const M=r.meters, S=r.seconds;
    const sh=r.shade_ratio, ts=r.max_surface_temp_c;
    // 표식: 출발 / 가게 / 도착
    rLayers.push(L.circleMarker([rOrigin.la,rOrigin.lo],{radius:7,color:"#fff",weight:2,fillColor:"#4d7fa8",fillOpacity:.95}).addTo(map));
    rLayers.push(L.marker([la,lo],{icon:L.divIcon({className:"",html:'<div class="poiPin">📍</div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map).bindTooltip(name,{direction:'top'}));
    rLayers.push(L.circleMarker([rDest.la,rDest.lo],{radius:7,color:"#fff",weight:2,fillColor:"#2e9e6b",fillOpacity:.95}).addTo(map));
    map.fitBounds(L.latLngBounds(r.coords.map(p=>[p.lat,p.lon])),{padding:[40,150]});
    const mn=v=>Math.max(1,Math.round(v/60));
    const base=baseRoute;
    const extra = base ? (S-base.seconds) : null;
    const head = base
      ? '<div class="act" style="background:#4d7fa81a;border:1px solid #4d7fa844">'
        +esc(name)+t.viaStop+'<br><small style="color:var(--txt)">'
        +t.viaWas+' '+mn(base.seconds)+t.dogMin+' → '+mn(S)+t.dogMin
        +' ('+(extra>=0?'+':'')+Math.round(extra/60)+t.dogMin+')</small></div>'
      : '<div class="act">'+esc(name)+t.viaStop+'</div>';
    setSheet(head+'<div class="cmp">'
      +'<div style="border-color:#4d7fa866"><div class="t">'+t.viaLeg1+'</div>'
      +'<div class="m">'+mn(a.seconds)+t.dogMin+' · '+a.meters+'m</div>'
      +'<div class="s">'+t.shadeW+' '+Math.round(a.shade_ratio*100)+'%</div></div>'
      +'<div style="border-color:#2e9e6b66"><div class="t">'+t.viaLeg2+'</div>'
      +'<div class="m">'+mn(b.seconds)+t.dogMin+' · '+b.meters+'m</div>'
      +'<div class="s">'+t.shadeW+' '+Math.round(b.shade_ratio*100)+'%</div></div></div>'
      +'<div class="foot"><span>'+t.shadeW+' '+Math.round(sh*100)+'% · '+t.paw+' '+Math.round(ts)+'°C</span>'
      +'<span>'+M+'m</span></div>');
    lastRoute=r;                 // 내비게이션도 합친 경로 하나를 그대로 쓴다
  }catch(e){ nocov(T().rFail); }
}
async function loadPoi(){
  if(poiBusy) return;
  poiBusy=true;
  const o=poiOrigin(), t=T();
  clearPoi();
  setSheet('<div style="font-size:13px;color:var(--muted)"><span class="spin"></span>'+t.poiLoad+'</div>');
  sheet.classList.remove('hidden');
  try{
    const kinds=POI_TABS[poiTab].k;
    const lang=(L_==='ko'?'ko':(L_==='en'?'en':'ja'));
    // 경로가 그려져 있으면 **그 길 위**를 찾는다. 없으면 현재 지점 주변.
    const onRoute = !!(lastRoute && lastRoute.coords && lastRoute.coords.length>1);
    let url;
    if(onRoute){
      const pathq = lastRoute.coords.map(p=>p.lat.toFixed(5)+','+p.lon.toFixed(5)).join(';');
      url = POI_ALONG+'?radius=150&lang='+lang+'&kinds='+encodeURIComponent(kinds)
            +'&path='+encodeURIComponent(pathq);
    } else {
      url = POI_API+'?lat='+o.la.toFixed(5)+'&lon='+o.lo.toFixed(5)
            +'&radius=800&lang='+lang+'&kinds='+encodeURIComponent(kinds);
    }
    const res=await fetch(url);
    const d=await res.json();
    const items=(d&&d.items)||[];
    const tabs='<div class="chips">'+POI_TABS.map((x,i)=>
      '<button data-i="'+i+'" class="'+(i===poiTab?'on':'')+'">'+x.t[L_]+'</button>').join('')+'</div>';
    if(!items.length){
      setSheet(tabs+'<div style="font-size:12.5px;color:var(--muted);padding:10px 2px;line-height:1.5">'
        +t.poiNone+'</div><div class="foot"><span>© OpenStreetMap contributors</span></div>');
    } else {
      const rows=items.slice(0,40).map((x,i)=>
        '<div class="prow" data-i="'+i+'"><div class="ic">'+(POI_ICON[x.kind]||'📍')+'</div>'
        +'<div class="nm">'+esc(x.name)
        +(x.name_en&&x.name_en!==x.name?' <small>'+esc(x.name_en)+'</small>':'')
        +(x.cuisine?' <small>· '+esc(x.cuisine)+'</small>':'')+'</div>'
        +'<div class="di">'+(x.at_m!=null
              ? (t.poiAt+' '+x.at_m+'m<br><small style="opacity:.7">'+t.poiOff+' '+x.detour_m+'m</small>')
              : x.meters+'m')+'</div></div>').join('');
      setSheet(tabs+'<div class="plist">'+rows+'</div>'
        +'<div class="foot"><span>'+(onRoute?t.poiOnRoute:t.poiPick)+'</span>'
        +'<span>© OpenStreetMap</span></div>');
      sheet.querySelectorAll('.prow').forEach(el=>{
        el.onclick=()=>{ const x=items[+el.dataset.i]; poiVia(x.lat,x.lon,x.name); };
      });
      items.slice(0,14).forEach(x=>{
        const m=L.marker([x.lat,x.lon],{icon:L.divIcon({className:"",
          html:'<div class="poiPin">'+(POI_ICON[x.kind]||'📍')+'</div>',
          iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);
        m.bindTooltip(x.name+' · '+x.meters+'m',{direction:'top'});
        m.on('click',()=>poiVia(x.lat,x.lon,x.name));
        poiLayers.push(m);
      });
    }
    sheet.querySelectorAll('.chips button').forEach(b=>{
      b.onclick=(ev)=>{ ev.stopPropagation(); poiTab=+b.dataset.i; poiBusy=false; loadPoi(); };
    });
    poiBtn.classList.add('on');
  }catch(e){ setSheet('<div style="font-size:13px;color:var(--muted)">'+T().err+'</div>'); }
  poiBusy=false;
}
poiBtn.onclick=()=>{
  if(poiLayers.length){ clearPoi(); poiBtn.classList.remove('on'); sheet.classList.add('hidden'); return; }
  loadPoi();
};
function esc(x){ return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ─── 강아지 산책 코스 (2026-09-13) ───────────────────────────
// 서버에 이미 /dog/course 가 있었다 — 개 높이 WBGT·발 화상 임계(노면 44℃)로 비용을 매기고
// **출발점으로 되돌아오는 순환 코스** 3개를 준다. 일본 앱에만 노출이 안 돼 있었다.
// 사람 경로와 다른 점은 두 가지: 높이(개 체고에서 노면 복사를 더 받는다)와 발 화상이다.
const DOG_API="/api/v1/dog/course";
let dogLayers=[], dogMin=30, dogCm=45, dogOrigin=null;
// 출발점은 **사용자가 찍은 자리**여야 한다 (2026-09-13). 예전엔 lastQ→현재위치→지도중심
// 순으로 알아서 골랐는데, 그게 어디인지 화면에 안 보여 엉뚱한 데서 시작한 것처럼 보였다.
const dogBtn=document.getElementById('dogBtn');
function clearDog(){ dogLayers.forEach(l=>l.remove()); dogLayers=[]; }
const DOG_COLORS=["#2e9e6b","#4d7fa8","#b4762e"];
async function loadDog(){
  const o=dogOrigin||poiOrigin(), t=T();
  dogOrigin=o;
  clearDog(); clearRoutes(); clearPoi();   // clearRoutes 가 lastRoute 를 비운다 → 아래에서 다시 채운다
  setSheet('<div style="font-size:13px;color:var(--muted)"><span class="spin"></span>'+t.dogCalc+'</div>');
  sheet.classList.remove('hidden');
  try{
    const res=await fetch(DOG_API+'?lat='+o.la.toFixed(5)+'&lon='+o.lo.toFixed(5)
                          +'&minutes='+dogMin+'&withers_cm='+dogCm);
    const d=await res.json();
    const cs=(d&&d.courses)||[];
    const opts='<div class="chips">'
      +[15,30,45,60].map(m=>'<button data-m="'+m+'" class="'+(m===dogMin?'on':'')+'">'+m+t.dogMin+'</button>').join('')
      +'<span style="width:8px"></span>'
      +[[25,t.dogS],[45,t.dogM],[65,t.dogL]].map(x=>'<button data-cm="'+x[0]+'" class="'+(x[0]===dogCm?'on':'')+'">'+x[1]+'</button>').join('')
      +'</div>';
    if(!cs.length){
      setSheet(opts+'<div style="font-size:12.5px;color:var(--muted);padding:10px 2px;line-height:1.5">'+t.dogNone+'</div>'
        +'<div class="foot"><span>'+t.dogTap+'</span></div>');
    } else {
      const rows=cs.map((c,i)=>
        '<div class="prow" data-i="'+i+'">'
        +'<div class="ic" style="color:'+DOG_COLORS[i%3]+'">●</div>'
        +'<div class="nm">'+esc(c.name||('코스 '+(i+1)))
        +'<br><small>'+t.shadeW+' '+Math.round((c.shade_ratio||0)*100)+'% · '
        +t.paw+' '+Math.round(c.max_surface_temp_c)+'°C</small></div>'
        +'<div class="di">'+Math.max(1,Math.round((c.seconds||0)/60))+t.dogMin+'<br>'
        +'<small style="opacity:.7">'+c.meters+'m</small></div></div>').join('');
      const known = Math.round((cs[0].surface_known_ratio||0)*100);
      setSheet(opts+'<div class="plist">'+rows+'</div>'
        +'<button id="navBtn" class="navstart">🧭 '+t.navStart+'</button>'
        +'<div class="foot"><span>'+t.dogTap+'</span><span>'+t.dogKnown+' '+known+'%</span></div>');
      lastRoute = {coords: cs[0].coords};   // 기본은 첫 코스. 목록에서 고르면 바뀐다.
      cs.forEach((c,i)=>{
        if(!c.coords) return;
        const line=L.polyline(c.coords.map(p=>[p.lat,p.lon]),
          {color:DOG_COLORS[i%3],weight:i===0?6:4,opacity:i===0?.95:.55}).addTo(map);
        dogLayers.push(line);
      });
      const b=L.latLngBounds(cs[0].coords.map(p=>[p.lat,p.lon]));
      map.fitBounds(b,{padding:[40,140]});
      dogLayers.push(L.circleMarker([o.la,o.lo],{radius:8,color:"#fff",weight:2,
        fillColor:"#4d7fa8",fillOpacity:.95}).addTo(map)
        .bindTooltip(t.dogStart,{permanent:true,direction:'top',offset:[0,-6]}));
      sheet.querySelectorAll('.prow').forEach(el=>{
        el.onclick=()=>{ const i=+el.dataset.i;
          dogLayers.filter(l=>l.setStyle).forEach((l,j)=>{ if(l.setStyle&&j<cs.length)
            l.setStyle({weight:j===i?6:4,opacity:j===i?.95:.35}); });
          map.fitBounds(L.latLngBounds(cs[i].coords.map(p=>[p.lat,p.lon])),{padding:[40,140]});
          lastRoute = {coords: cs[i].coords};          // 안내 대상 = 고른 코스
          sheet.querySelectorAll('.prow').forEach(x=>x.style.background='');
          el.style.background='#4d7fa81a';
        };
      });
    }
    sheet.querySelectorAll('.chips button').forEach(b2=>{
      b2.onclick=(ev)=>{ ev.stopPropagation();
        if(b2.dataset.m) dogMin=+b2.dataset.m; else dogCm=+b2.dataset.cm;
        loadDog(); };
    });
    dogBtn.classList.add('on');
  }catch(e){ setSheet('<div style="font-size:13px;color:var(--muted)">'+T().err+'</div>'); }
}
dogBtn.onclick=()=>{
  if(dogLayers.length){ clearDog(); dogOrigin=null; dogBtn.classList.remove('on'); sheet.classList.add('hidden'); return; }
  loadDog();
};

// ─── 턴바이턴 안내 (2026-09-13) ──────────────────────────────
// 상수는 아이폰 DogNavEngine·안드로이드 TrailMap 과 **같은 값**이다 (2026-08-30 문서).
// 웹만 다르게 굴면 같은 회사 앱이 서로 다른 말을 하게 된다.
const NAV = {
  OFF_M: 45,          // 이탈 판정 거리
  OFF_HITS: 3,        // 연속 몇 번이면 이탈로 보나
  BAD_ACC_M: 40,      // 수평정확도가 이보다 나쁘면 그 fix 는 무시
  TURN_DEG: 35,       // 이 각도 이상이면 회전
  UTURN_DEG: 135,     // 이 각도 초과면 유턴
  PRE_M: 35,          // 회전 음성 예고 거리
  ARRIVE_M: 20,       // 도착 판정
  GRACE_MS: 45000,    // 출발 직후 이탈 유예(도로망 점과 실제 위치가 벌어져 있다)
  GRACE_M: 30,
};
let navOn=false, navPts=[], navTurns=[], navWatch=null, navTrail=null, navMe=null,
    navOff=0, navSpoken={}, navT0=0, navSnapped=false, navLoop=false, navS=0, navTotal=0;
const navbar=document.getElementById('navbar');

function _m(aLat,aLon,bLat,bLon){ const R=6371000,p=Math.PI/180;
  const x=(bLon-aLon)*p*Math.cos((aLat+bLat)/2*p), y=(bLat-aLat)*p; return Math.hypot(x,y)*R; }
function _bear(a,b){ const p=Math.PI/180;
  const y=Math.sin((b.lon-a.lon)*p)*Math.cos(b.lat*p);
  const x=Math.cos(a.lat*p)*Math.sin(b.lat*p)-Math.sin(a.lat*p)*Math.cos(b.lat*p)*Math.cos((b.lon-a.lon)*p);
  return (Math.atan2(y,x)*180/Math.PI+360)%360; }
function _dAng(a,b){ return ((b-a+540)%360)-180; }

// 경로 꼭짓점에서 회전 지점을 뽑는다. 짧은 변이 이어지면 각이 튀므로 20m 이상만 본다.
function buildTurns(pts){
  const out=[]; let acc=0;
  const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+_m(pts[i-1].lat,pts[i-1].lon,pts[i].lat,pts[i].lon));
  for(let i=1;i<pts.length-1;i++){
    let j=i-1; while(j>0 && _m(pts[j].lat,pts[j].lon,pts[i].lat,pts[i].lon)<20) j--;
    let k=i+1; while(k<pts.length-1 && _m(pts[i].lat,pts[i].lon,pts[k].lat,pts[k].lon)<20) k++;
    const d=_dAng(_bear(pts[j],pts[i]), _bear(pts[i],pts[k]));
    if(Math.abs(d)>=NAV.TURN_DEG){
      const kind = Math.abs(d)>NAV.UTURN_DEG ? 'u' : (d>0?'r':'l');
      if(!out.length || cum[i]-out[out.length-1].at > 25) out.push({i, at:cum[i], kind});
    }
  }
  out.push({i:pts.length-1, at:cum[cum.length-1], kind:'end'});
  return out;
}
function speak(txt){
  try{ if(!('speechSynthesis' in window)) return;
    const u=new SpeechSynthesisUtterance(txt);
    u.lang = L_==='ja'?'ja-JP':(L_==='en'?'en-US':'ko-KR'); u.rate=1.05;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
// 현재 위치를 경로에 투영 — (경로상 진행거리, 벗어난 거리)
// ⚠️ 순환 코스는 출발점과 도착점이 같은 자리다. 전체 경로에서 투영하면 현재 위치가
//    **끝**에 붙어 시작하자마자 '도착' 이 된다 (2026-08-30 아이폰에서 겪은 함정).
//    → 첫 투영은 앞쪽(코스 절반 또는 300m 중 짧은 쪽)에서만, 그 뒤엔 뒤 80m~앞 300m 창.
function projectOn(pts, la, lo, lo_s, hi_s){
  let best={d:1e9,s:0}; let cum=0;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    const L=_m(a.lat,a.lon,b.lat,b.lon);
    const mlat=111320, mlon=111320*Math.cos(la*Math.PI/180);
    const ax=0, ay=0, bx=(b.lon-a.lon)*mlon, by=(b.lat-a.lat)*mlat;
    const px=(lo-a.lon)*mlon, py=(la-a.lat)*mlat;
    const L2=bx*bx+by*by; const t=L2<=0?0:Math.max(0,Math.min(1,(px*bx+py*by)/L2));
    const d=Math.hypot(px-bx*t, py-by*t);
    const sHere=cum+L*t;
    const inWin = (lo_s==null) || (sHere>=lo_s && sHere<=hi_s);
    if(inWin && d<best.d) best={d, s:sHere};
    cum+=L;
  }
  best.total=cum;
  if(best.d>=1e9){ best.d=0; best.s=lo_s||0; }   // 창 안에 아무것도 없으면 제자리 유지
  return best;
}
const ARROW={l:'↰', r:'↱', u:'⤺', end:'🏁'};
function navRender(prj){
  const t=T();
  const nxt = navTurns.find(x=>x.at > prj.s - 5) || navTurns[navTurns.length-1];
  const toTurn = Math.max(0, Math.round(nxt.at - prj.s));
  const left = Math.max(0, Math.round(prj.total - prj.s));
  const mins = Math.max(1, Math.round(left/70));   // 성인 분당 70m — 앱과 같은 값
  const label = nxt.kind==='end' ? t.navArriveIn
              : (toTurn+'m '+t.navThen+' '+(nxt.kind==='l'?t.navL:nxt.kind==='r'?t.navR:t.navU));
  navbar.innerHTML='<button class="x">✕</button><div class="ar">'+(ARROW[nxt.kind]||'↑')+'</div>'
    +'<div class="t1">'+label+'</div>'
    +'<div class="t2">'+t.navLeft+' '+left+'m · '+mins+t.dogMin
    +(prj.d>NAV.OFF_M?' · <span style="color:#e8641c">'+t.navOff+'</span>':'')+'</div>';
  navbar.querySelector('.x').onclick=()=>navStop();
  // 음성: 회전 35m 앞에서 한 번씩
  if(nxt.kind!=='end' && toTurn<=NAV.PRE_M && !navSpoken[nxt.i]){
    navSpoken[nxt.i]=1;
    speak(nxt.kind==='l'?t.navL:nxt.kind==='r'?t.navR:t.navU);
  }
  if(left<=NAV.ARRIVE_M && !navSpoken.done){ navSpoken.done=1; speak(t.navArrived); }
}
function navStart(){
  if(!(lastRoute&&lastRoute.coords&&lastRoute.coords.length>1)) return;
  if(!navigator.geolocation){ geoerr(2); return; }
  navPts=lastRoute.coords.slice(); navTurns=buildTurns(navPts);
  navTotal=navTurns[navTurns.length-1].at;
  const a0=navPts[0], z0=navPts[navPts.length-1];
  navLoop = _m(a0.lat,a0.lon,z0.lat,z0.lon) < 40;   // 출발=도착이면 순환 코스
  navOn=true; navOff=0; navSpoken={}; navT0=Date.now(); navSnapped=false; navS=0;
  navbar.classList.add('on'); sheet.classList.add('hidden');
  if(navTrail) navTrail.remove();
  navTrail=L.polyline([],{color:'#e8901c',weight:5,opacity:.85}).addTo(map);
  speak(T().navBegin);
  navWatch=navigator.geolocation.watchPosition(p=>{
    const acc=p.coords.accuracy;
    if(acc==null || acc>NAV.BAD_ACC_M) return;      // 약신호 fix 는 버린다
    const la=p.coords.latitude, lo=p.coords.longitude;
    if(!navMe) navMe=L.circleMarker([la,lo],{radius:8,color:'#fff',weight:2,
      fillColor:'#e8901c',fillOpacity:.95}).addTo(map);
    else navMe.setLatLng([la,lo]);
    navTrail.addLatLng([la,lo]);
    map.setView([la,lo], Math.max(map.getZoom(),17), {animate:true});
    // 순환 코스는 창을 제한한다. 편도는 제한 없이(null) 전체에서 찾는다.
    let loS=null, hiS=null;
    if(navLoop){
      if(!navSnapped){ loS=0; hiS=Math.min(navTotal/2, 300); }
      else { loS=Math.max(0,navS-80); hiS=Math.min(navTotal, navS+300); }
    }
    const prj=projectOn(navPts,la,lo,loS,hiS);
    if(prj.d<=NAV.GRACE_M) navSnapped=true;
    navS=prj.s;
    const inGrace = !navSnapped && (Date.now()-navT0 < NAV.GRACE_MS);
    if(prj.d>NAV.OFF_M && !inGrace){
      navOff++;
      if(navOff===NAV.OFF_HITS) speak(T().navOff);
    } else navOff=0;
    navRender(prj);
  }, e=>{ if(e && e.code===1){ navStop(); geoerr(1); } },
     {enableHighAccuracy:true, maximumAge:2000, timeout:15000});
}
function navStop(){
  navOn=false; navbar.classList.remove('on');
  if(navWatch!=null){ navigator.geolocation.clearWatch(navWatch); navWatch=null; }
  if(navMe){ navMe.remove(); navMe=null; }
  if(navTrail){ navTrail.remove(); navTrail=null; }
  try{ window.speechSynthesis.cancel(); }catch(e){}
}
// 경로 시트가 다시 그려질 때마다 버튼을 다시 묶는다
const _origSetSheet = setSheet;
setSheet = function(html){
  _origSetSheet(html);
  const b=sheet.querySelector('#navBtn');
  if(b) b.onclick=(ev)=>{ ev.stopPropagation(); navStart(); };
};

applyLang();

// ─── 대시보드(home.html)에서 넘어온 경우 ─────────────────────
// 카드를 누르면 그 기능이 켜진 채로 열린다. 기능 자체는 여기 있는 것을 그대로 쓴다 —
// 대시보드는 화면일 뿐이고, 경로·주변·강아지 로직을 다시 만들지 않는다 (2026-09-18).
(function(){
  const u = new URL(location.href);
  const la = parseFloat(u.searchParams.get('lat')), lo = parseFloat(u.searchParams.get('lon'));
  if(!isNaN(la) && !isNaN(lo)) map.setView([la, lo], 17);
  const mode = u.searchParams.get('mode');
  if(!mode) return;
  // 지도·타일이 자리를 잡은 뒤에 켠다. 바로 부르면 시트가 지도보다 먼저 떠 레이아웃이 어긋난다.
  setTimeout(() => {
    try{
      if(mode === 'route') routeBtn.onclick();
      else if(mode === 'poi') poiBtn.onclick();
      else if(mode === 'dog') dogBtn.onclick();
    }catch(e){}
  }, 350);
})();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
</script>
