<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>현장 대조</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="현장 대조">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!--
  ClimaX 현장 실측 ↔ 엔진 자동 대조 도구 (2026-08-16, 대표 전용)

  기존 현장실측 도구(climax_field)와의 차이:
   · 앱 값을 눈으로 보고 손으로 옮겨 적는 대신, 서버 엔진을 직접 호출해
     같은 순간·같은 좌표의 산출 전체를 받아 잔차를 자동 계산한다.
   · 실측·산출 짝이 서버 DB(field_check)에 자동 적재된다
     → PWI 풍속 보정·MRT 검증·계수 교정의 원천 데이터.

  사용법: 이 파일을 폰으로 보내 브라우저로 열기(파일 앱에서 열림) 또는
  Netlify 기존 사이트에 field_admin.html 로 추가 업로드.
  첫 실행 때 접근키(FIELD_KEY) 입력 — 이 폰에만 저장된다.

  ⚠️ 접근키가 없으면 서버가 404 — 이 파일이 유출돼도 데이터는 못 넣는다.
  ⚠️ GPS 자동 좌표는 https 호스팅에서만 동작(브라우저 정책). http/파일로 열면
     '우리 집' 버튼이나 수동 입력을 쓰면 된다.
-->
<style>
  :root { --teal:#0d9488; --coral:#f97066; --bg:#f4f4f6; --card:#fff; --ink:#111; --mut:#777; }
  * { box-sizing:border-box; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
  body { margin:0; background:var(--bg); color:var(--ink); padding:16px; max-width:520px; margin-inline:auto; }
  h1 { font-size:19px; margin:4px 0 2px; }
  .sub { color:var(--mut); font-size:12px; margin-bottom:14px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .card h2 { font-size:14px; margin:0 0 10px; }
  label { display:block; font-size:12px; color:var(--mut); margin:8px 0 3px; }
  input, textarea { width:100%; padding:10px; border:1px solid #ddd; border-radius:9px; font-size:16px; }
  .row { display:flex; gap:8px; }
  .row > div { flex:1; }
  button { width:100%; padding:13px; border:0; border-radius:11px; font-size:16px; font-weight:700; cursor:pointer; }
  .primary { background:var(--teal); color:#fff; margin-top:12px; }
  .ghost { background:#e8e8ec; color:#333; font-size:13px; padding:9px; width:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:right; padding:6px 4px; border-bottom:1px solid #eee; }
  th:first-child, td:first-child { text-align:left; }
  .ok  { color:var(--teal); font-weight:700; }
  .bad { color:var(--coral); font-weight:700; }
  .status { font-size:13px; color:var(--mut); margin-top:10px; white-space:pre-line; }
  .pill { display:inline-block; background:#eef7f6; color:var(--teal); border-radius:99px; padding:2px 10px; font-size:12px; font-weight:700; }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  #tgtMap{height:300px;border-radius:11px;margin-top:10px;background:#dcdcd6}
  .lbl{font:600 11px/1 sans-serif;color:#fff;text-shadow:0 0 3px #000}
  .leaflet-container{font:inherit}
</style>
</head>
<body>
<h1>🌡 현장 대조 <span class="pill">대표 전용</span></h1>
<div class="sub">실측을 넣으면 같은 순간 엔진 산출과 자동 대조 · 짝은 서버에 적재</div>

<div class="card" id="tgtCard">
  <h2>🎯 갈 지점 <span style="font-weight:400;color:var(--mut)">(가까운 순)</span></h2>
  <div id="tgtWhy" class="status" style="margin:0 0 8px"></div>
  <div class="row">
    <button class="ghost" onclick="loadTargets()">목록 불러오기</button>
    <button class="ghost" onclick="toggleDone()">완료 숨기기/보기</button>
  </div>
  <div id="tgtMap"></div>
  <div class="status" style="margin:6px 0 0">
    주황 = 3월 재촬영 · 보라 = 가로수 · 초록 = 큰 나무 · 파랑 = 기록지 표 좌표 · 연두 = 현재 위치.
    점을 눌러 그 좌표를 위/경도 칸에 넣습니다.
  </div>
  <div id="tgtList" style="margin-top:10px"></div>
</div>

<div class="card">
  <h2>📍 위치</h2>
  <div class="row">
    <div><label>위도</label><input id="lat" type="number" step="any" inputmode="decimal"></div>
    <div><label>경도</label><input id="lon" type="number" step="any" inputmode="decimal"></div>
  </div>
  <div class="row" style="margin-top:9px">
    <button class="ghost" onclick="useHome()">🏠 우리 집</button>
    <button class="ghost" onclick="useGPS()">📡 GPS</button>
  </div>
</div>

<div class="card">
  <h2>✍️ 실측값 <span style="font-weight:400;color:var(--mut)">(잰 것만 입력 — 빈 칸 무시)</span></h2>
  <div class="row">
    <div><label>기온 Ta (°C)</label><input id="m_ta" type="number" step="any" inputmode="decimal"></div>
    <div><label>습도 RH (%)</label><input id="m_rh" type="number" step="any" inputmode="decimal"></div>
  </div>
  <div class="row">
    <div><label>풍속 (m/s)</label><input id="m_wind" type="number" step="any" inputmode="decimal"></div>
    <div><label>흑구 Tg (°C)</label><input id="m_globe" type="number" step="any" inputmode="decimal"></div>
  </div>
  <div class="row">
    <div><label>노면온도 (°C, IR)</label><input id="m_surf" type="number" step="any" inputmode="decimal"></div>
    <div><label>실측 PET (도구 계산값)</label><input id="m_pet" type="number" step="any" inputmode="decimal"></div>
  </div>
  <label>메모 (장소·조건)</label><input id="m_note" placeholder="예: 토곡로 인도, 그늘, 버스 지나감">
  <button class="primary" onclick="submit()">엔진과 대조 + 저장</button>
  <div id="status" class="status"></div>
</div>

<div class="card">
  <h2>🧠 뇌 상태 <span style="font-weight:400;color:var(--mut)">(쌓인 학습 데이터)</span></h2>
  <button class="ghost" onclick="loadStats()">현황 불러오기</button>
  <div id="statTiles" style="display:flex;gap:8px;margin-top:10px"></div>
  <div id="tsurfBox" style="margin-top:10px"></div>
  <div id="fieldBox" style="margin-top:6px"></div>
</div>

<div class="card" id="resultCard" style="display:none">
  <h2>📊 대조 결과</h2>
  <table id="resultTable"></table>
  <div class="status" id="resultNote"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// 서버가 이 페이지를 직접 서빙하므로(/api/v1/field) 같은 서버로 상대경로 호출 —
// http/https 어느 쪽이든 mixed-content 문제가 없다. 파일로 열었을 때만 절대주소 폴백.
const API = location.protocol.startsWith("http") ? "" : "http://180.210.76.123";
const HOME = [35.18232, 129.10330];           // 연산엘지

function $(id){ return document.getElementById(id); }
function num(id){ const v = $(id).value.trim(); return v === "" ? null : parseFloat(v); }

function useHome(){ $("lat").value = HOME[0]; $("lon").value = HOME[1]; }
function useGPS(){
  if (!navigator.geolocation) { $("status").textContent = "이 환경에선 GPS 불가 — 수동 입력"; return; }
  navigator.geolocation.getCurrentPosition(
    p => { $("lat").value = p.coords.latitude.toFixed(6); $("lon").value = p.coords.longitude.toFixed(6); },
    e => { $("status").textContent = "GPS 실패(" + e.message + ") — http/파일에서는 막힘. 수동 입력 또는 우리 집."; }
  );
}

// ── 갈 지점 (2026-09-15) ────────────────────────────────────────────────────
// 왜: "이 좌표에서 재 주세요" 를 말로 주고받으면 현장에서 잃어버린다.
//     `field_targets.json` 을 갱신하면 여기에 그대로 뜬다. 앱을 고칠 필요가 없다.
//
// 좌표 두 개를 같이 보여준다 — 3월 실측은 **기록지 표 좌표와 사진 EXIF 좌표가**
// 중앙 13 m, 최대 100 m 어긋나 있다. 어느 쪽이 맞는지는 현장에서 눈으로 판정하는 게 제일 낫다.
// 기본값은 **사진 좌표**다(정답지인 360 사진이 찍힌 자리이므로).
let TGT = null, HIDE_DONE = false, MY = null;

function doneKey(id){ return "climax_tgt_done_" + id; }
function isDone(id){ try { return localStorage.getItem(doneKey(id)) === "1"; } catch(e){ return false; } }
function setDone(id, v){ try { v ? localStorage.setItem(doneKey(id),"1")
                                : localStorage.removeItem(doneKey(id)); } catch(e){} }
function toggleDone(){ HIDE_DONE = !HIDE_DONE; renderTargets(); }

function distM(a,b,c,d){
  const R=6371000, r=Math.PI/180;
  const dp=(c-a)*r, dl=(d-b)*r;
  const x=Math.sin(dp/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

async function loadTargets(){
  $("tgtWhy").textContent = "불러오는 중…";
  try {
    const r = await fetch(API + "/api/v1/field/targets?v=" + Date.now());
    TGT = await r.json();
  } catch(e){ $("tgtWhy").textContent = "목록을 못 읽었습니다: " + e.message; return; }
  if (navigator.geolocation){
    navigator.geolocation.watchPosition(p=>{
      MY = [p.coords.latitude, p.coords.longitude, p.coords.accuracy];
      renderTargets();
    }, ()=>renderTargets(), {enableHighAccuracy:true, maximumAge:0, timeout:20000});
  }
  renderTargets();
}

function pick(lat, lon, id, which){
  $("lat").value = lat.toFixed(6);
  $("lon").value = lon.toFixed(6);
  $("m_note").value = id + " (" + which + ")";
  $("status").textContent = id + " 좌표를 넣었습니다 — " + which;
  window.scrollTo({top: $("lat").getBoundingClientRect().top + window.scrollY - 80,
                   behavior:"smooth"});
}

// 지도 — 좌표를 눈으로 보고 고른다. 3월 실측은 표 좌표와 사진 좌표가 중앙 13 m,
// 최대 100 m 어긋나 있어서 숫자만으로는 어느 쪽이 맞는지 판단할 수 없다.
// 위성영상 위에 두 점을 올리고 현재 위치까지 겹쳐 보면 현장에서 바로 정해진다.
let MAP = null, MLAYER = null, MEDOT = null, MERING = null;

function ensureMap(){
  if (MAP) return MAP;
  MAP = L.map('tgtMap', {zoomControl:true}).setView([35.2340,129.0795], 16);
  const sat = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:21, maxNativeZoom:19, attribution:'Esri'}).addTo(MAP);
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19, attribution:'&copy; OSM'});
  L.control.layers({'위성':sat, '지도':osm}, null, {collapsed:true}).addTo(MAP);
  MLAYER = L.featureGroup().addTo(MAP);
  return MAP;
}

function drawMap(){
  if (!TGT) return;
  ensureMap();
  MLAYER.clearLayers();
  const seen = [];
  // 그룹별 색 — 현장에서 어떤 종류의 지점인지 지도만 보고 알게 한다.
  const GC = {mar27:'#e8590c', garosu:'#7048e8', canopy:'#2f7a3d'};
  for (const g of TGT.groups){
    const col = GC[g.id] || '#e8590c';
    for (const p of g.points){
      if (HIDE_DONE && isDone(p.id)) continue;
      const dim = isDone(p.id) ? 0.35 : 1;
      const info = "<b>" + p.id + "</b><br>" + (p.note || "") +
        (p.alt_gap_m ? "<br>표 좌표와 " + p.alt_gap_m + " m 차이" : "");
      const m2 = L.circleMarker([p.lat,p.lon], {radius:7, color:'#fff', weight:2,
          fillColor:col, fillOpacity:dim})
        .bindPopup(info + "<br><b>사진 EXIF 좌표</b><br>" +
                   p.lat.toFixed(6) + ", " + p.lon.toFixed(6))
        .on('click', ()=>pick(p.lat, p.lon, p.id, "사진 EXIF 좌표"))
        .addTo(MLAYER);
      seen.push([p.lat,p.lon]);
      if (p.alt_lat){
        L.circleMarker([p.alt_lat,p.alt_lon], {radius:7, color:'#fff', weight:2,
            fillColor:'#1f6feb', fillOpacity:dim})
          .bindPopup(info + "<br><b>기록지 표 좌표</b><br>" +
                     p.alt_lat.toFixed(6) + ", " + p.alt_lon.toFixed(6))
          .on('click', ()=>pick(p.alt_lat, p.alt_lon, p.id, "기록지 표 좌표"))
          .addTo(MLAYER);
        L.polyline([[p.alt_lat,p.alt_lon],[p.lat,p.lon]],
          {color:'#333', weight:2, opacity:.6*dim, dashArray:'4,4'}).addTo(MLAYER);
        seen.push([p.alt_lat,p.alt_lon]);
      }
      L.marker([p.lat,p.lon], {icon: L.divIcon({className:'lbl',
        html:p.id.replace('point','').replace('가로수','G').replace('수관','C'),
        iconSize:[22,12], iconAnchor:[-6,14]})}).addTo(MLAYER);
    }
  }
  if (MY){
    const ll = [MY[0], MY[1]];
    if (MEDOT){ MAP.removeLayer(MEDOT); MAP.removeLayer(MERING); }
    MERING = L.circle(ll, {radius:MY[2], color:'#2f7a3d', weight:1, fillOpacity:.08}).addTo(MAP);
    MEDOT = L.circleMarker(ll, {radius:6, color:'#fff', weight:2,
      fillColor:'#2f7a3d', fillOpacity:1})
      .bindPopup("현재 위치<br>정확도 ±" + Math.round(MY[2]) + " m<br>" +
                 MY[0].toFixed(6) + ", " + MY[1].toFixed(6))
      .on('click', ()=>pick(MY[0], MY[1], "현재위치", "GPS ±" + Math.round(MY[2]) + " m"))
      .addTo(MAP);
  }
  if (!MAP._fitOnce && seen.length){
    MAP.fitBounds(L.latLngBounds(seen).pad(0.15));
    MAP._fitOnce = true;
  }
  setTimeout(()=>MAP.invalidateSize(), 60);
}

function focusPoint(p){
  ensureMap();
  const c = p.alt_lat ? [(p.lat+p.alt_lat)/2, (p.lon+p.alt_lon)/2] : [p.lat, p.lon];
  MAP.setView(c, 19);
  document.getElementById('tgtMap').scrollIntoView({behavior:'smooth', block:'center'});
}

function renderTargets(){
  if (!TGT) return;
  drawMap();
  const box = $("tgtList");
  box.innerHTML = "";
  $("tgtWhy").innerHTML =
    TGT.groups.map(g=>"<b>" + g.title + "</b> (" + g.points.length + ")").join(" · ") +
    (MY ? "<br>현재 위치 정확도 ±" + Math.round(MY[2]) + " m" : "");

  for (const g of TGT.groups){
    // 그룹 머리 — 왜 가는지, 뭘 하는지를 현장에서 바로 읽게 둔다.
    const h = document.createElement("div");
    h.style.cssText = "margin:14px 0 2px;padding:10px 12px;border-radius:10px;" +
                      "background:#eef1f6;border:1px solid var(--line)";
    h.innerHTML = "<b style='font-size:14px'>" + g.title + "</b>" +
      "<div style='color:var(--mut);font-size:12px;margin-top:4px'>" + (g.why||"") + "</div>" +
      "<div style='font-size:12.5px;margin-top:6px'><b>할 일:</b> " + (g.do||"") + "</div>";
    box.appendChild(h);

    const rows = g.points.map(p=>({p, d: MY ? distM(MY[0],MY[1],p.lat,p.lon) : null}));
    if (MY) rows.sort((a,b)=>a.d-b.d);
    for (const {p, d} of rows){
      const done = isDone(p.id);
      if (HIDE_DONE && done) continue;
      const el = document.createElement("div");
      el.style.cssText = "padding:9px 0;border-top:1px solid var(--line);" +
                         (done ? "opacity:.45" : "");
      const near = d !== null && d < 15;
      el.innerHTML =
        "<div style='display:flex;align-items:baseline;gap:8px;cursor:pointer' onclick='0'>" +
          "<b style='font-size:15px'>" + p.id + "</b>" +
          (d !== null ? "<span style='margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;" +
             (near ? "color:#2f7a3d" : "") + "'>" + (d<1000 ? Math.round(d)+" m" : (d/1000).toFixed(1)+" km") + "</span>" : "") +
        "</div>" +
        "<div style='color:var(--mut);font-size:12.5px;margin:2px 0 6px'>" + (p.note||"") +
          (p.alt_gap_m ? " · 표 좌표와 " + p.alt_gap_m + " m 차이" : "") + "</div>";
      const r1 = document.createElement("div");
      r1.className = "row";
      const b1 = document.createElement("button");
      b1.className = "ghost"; b1.textContent = "📷 사진 좌표";
      b1.onclick = ()=>{ pick(p.lat, p.lon, p.id, "사진 EXIF 좌표"); };
      r1.appendChild(b1);
      if (p.alt_lat){
        const b2 = document.createElement("button");
        b2.className = "ghost"; b2.textContent = "📋 표 좌표";
        b2.onclick = ()=>pick(p.alt_lat, p.alt_lon, p.id, "기록지 표 좌표");
        r1.appendChild(b2);
      }
      const b3 = document.createElement("button");
      b3.className = "ghost"; b3.textContent = done ? "↩︎ 취소" : "✓ 완료";
      b3.onclick = ()=>{ setDone(p.id, !done); renderTargets(); };
      r1.appendChild(b3);
      const b4 = document.createElement("button");
      b4.className = "ghost"; b4.textContent = "🗺 지도";
      b4.onclick = ()=>focusPoint(p);
      r1.appendChild(b4);
      el.appendChild(r1);
      box.appendChild(el);
    }
  }
}

function fieldKey(){
  let k = localStorage.getItem("climax_field_key");
  if (!k) {
    k = prompt("접근키(FIELD_KEY)를 입력하세요 — 이 폰에만 저장됩니다.");
    if (k) localStorage.setItem("climax_field_key", k.trim());
  }
  return (k || "").trim();
}

async function submit(){
  const lat = num("lat"), lon = num("lon");
  if (lat === null || lon === null) { $("status").textContent = "위치를 먼저 넣어주세요."; return; }
  const key = fieldKey();
  if (!key) { $("status").textContent = "접근키가 필요합니다."; return; }

  const meas = {};
  const map = { m_ta:"ta", m_rh:"rh", m_wind:"wind_ms", m_globe:"globe_c", m_surf:"surface_c", m_pet:"pet" };
  for (const [id, k2] of Object.entries(map)) { const v = num(id); if (v !== null) meas[k2] = v; }
  if (Object.keys(meas).length === 0) { $("status").textContent = "실측값을 하나 이상 입력하세요."; return; }

  $("status").textContent = "엔진 계산 중… (첫 방문 지점은 10~20초 걸릴 수 있어요)";
  try {
    const r = await fetch(API + "/api/v1/field/check", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Field-Key": key },
      body: JSON.stringify({ lat, lon, meas, note: $("m_note").value || null }),
    });
    if (r.status === 404) { localStorage.removeItem("climax_field_key");
      $("status").textContent = "접근키가 틀립니다 — 다시 시도하면 재입력 창이 뜹니다."; return; }
    if (!r.ok) { $("status").textContent = "서버 오류 " + r.status; return; }
    const d = await r.json();
    render(d, meas);
    $("status").textContent = d.saved ? "✅ 저장 완료 — 교정 데이터로 쌓였습니다." : "⚠️ 대조는 됐지만 DB 저장은 안 됨";
  } catch (e) {
    $("status").textContent = "연결 실패: " + e.message + "\n(https 페이지에서 http 서버 호출은 브라우저가 막습니다 — 파일로 열거나 HTTPS 전환 후 사용)";
  }
}

async function loadStats(){
  const key = fieldKey();
  if (!key) return;
  $("statTiles").innerHTML = '<span class="status">불러오는 중…</span>';
  try {
    const r = await fetch(API + "/api/v1/field/stats", { headers: { "X-Field-Key": key } });
    if (r.status === 404) { localStorage.removeItem("climax_field_key");
      $("statTiles").innerHTML = '<span class="status">접근키가 틀립니다 — 다시 시도하세요.</span>'; return; }
    const d = await r.json();
    if (!d.ready) { $("statTiles").innerHTML = '<span class="status">DB 연결 안 됨</span>'; return; }

    const tiles = [
      ["측정 이력", d.counts.measurement],
      ["ASOS 잔차짝", d.counts.engine_check],
      ["현장 실측짝", d.counts.field_check],
    ].map(([n,v]) =>
      `<div style="flex:1;background:#eef7f6;border-radius:10px;padding:10px;text-align:center">
         <div style="font-size:20px;font-weight:800;color:var(--teal)">${v}</div>
         <div style="font-size:11px;color:var(--mut)">${n}</div></div>`).join("");
    $("statTiles").innerHTML = tiles;

    if (d.tsurf && d.tsurf.length) {
      const rs = d.tsurf.map(x => x.resid);
      const mean = (rs.reduce((a,b)=>a+b,0)/rs.length).toFixed(1);
      const worst = rs.reduce((a,b)=>Math.abs(b)>Math.abs(a)?b:a,0).toFixed(1);
      const last = d.tsurf[0];
      $("tsurfBox").innerHTML =
        `<div style="font-size:13px"><b>지면온도 채점 (최근 48h · ${rs.length}건)</b><br>` +
        `평균 잔차 <b class="${Math.abs(mean)<=2?'ok':'bad'}">${mean>0?'+':''}${mean}°C</b> · ` +
        `최대 ${worst>0?'+':''}${worst}°C<br>` +
        `<span class="status">최근: 실측 ${last.obs}° vs 엔진 ${last.est}° — ` +
        `잔차가 한쪽으로 쏠리면 계수 교정 신호</span></div>`;
    } else {
      $("tsurfBox").innerHTML = '<span class="status">지면온도 짝 아직 없음 — 배포 후 시간당 1건씩 쌓입니다</span>';
    }

    if (d.field && d.field.length) {
      $("fieldBox").innerHTML = '<div style="font-size:13px;margin-top:4px"><b>내 최근 실측</b></div>' +
        d.field.map(f =>
          `<div class="status">· ${f.t.slice(5,16).replace("T"," ")} — ${f.note || "(메모 없음)"}` +
          (f.est && f.est.pvpti !== undefined ? ` · 엔진 ${f.est.pvpti}°` : "") + `</div>`).join("");
    }
  } catch (e) { $("statTiles").innerHTML = '<span class="status">연결 실패: ' + e.message + '</span>'; }
}

function render(d, meas){
  const est = d.est, res = d.residual || {};
  const rows = [
    ["체감 (PET/UTCI)", meas.pet,     est.pvpti, res.pvpti],
    ["기온 Ta",         meas.ta,      est.ta,    res.ta],
    ["습도 RH",         meas.rh,      est.rh,    res.rh],
    ["보행자 풍속",     meas.wind_ms, est.u_p,   res.u_p],
    ["MRT (흑구 대응)", meas.mrt,     est.mrt,   res.mrt],
  ];
  let html = "<tr><th>항목</th><th>실측</th><th>엔진</th><th>Δ(엔진−실측)</th></tr>";
  for (const [name, m, e, r0] of rows) {
    if (m === undefined && e === undefined) continue;
    const cls = r0 === undefined ? "" : (Math.abs(r0) <= 2 ? "ok" : "bad");
    html += `<tr><td>${name}</td><td>${m ?? "—"}</td><td>${e ?? "—"}</td>` +
            `<td class="${cls}">${r0 !== undefined ? (r0 > 0 ? "+" : "") + r0 : "—"}</td></tr>`;
  }
  $("resultTable").innerHTML = html;
  $("resultNote").textContent =
    `엔진 등급 ${est.risk} · 지수 ${est.index} · 기상 ${est.weather_source}` +
    ` — |Δ|≤2°C 양호(초록) / 초과(주황)는 원인 분해 대상`;
  $("resultCard").style.display = "block";
}
</script>
