<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860" font-family="'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ar_ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs>
<rect width="1180" height="860" fill="#FFFFFF"/>
<text x="590.0" y="40" font-size="20" fill="#111827" font-weight="bold" text-anchor="middle">물리 뼈대 + 잔차 AI — 추론 흐름 (스트리트뷰 없이 좌표 → 체감 → 행동)</text>
<rect x="40" y="70" width="1100" height="150" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="60" y="95" font-size="14" fill="#4B5563" font-weight="bold" text-anchor="start">입력  ·  거리영상·현장센서 없음 — 커버리지 밖 골목에도 존재하는 것만</text>
<rect x="60.0" y="112" width="250" height="90" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.6"/>
<text x="185.0" y="140" font-size="15" fill="#111827" font-weight="bold" text-anchor="middle">건물지도 (GIS)</text>
<text x="185.0" y="165.0" font-size="13" fill="#4B5563" font-weight="normal" text-anchor="middle">기하 SVF · 가로폭 W · H/W</text>
<text x="185.0" y="183.85" font-size="13" fill="#4B5563" font-weight="normal" text-anchor="middle">태양방향 그늘 (ray-cast)</text>
<rect x="330.0" y="112" width="250" height="90" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.6"/>
<text x="455.0" y="140" font-size="15" fill="#111827" font-weight="bold" text-anchor="middle">위성 (Sentinel-2)</text>
<text x="455.0" y="165.0" font-size="13" fill="#4B5563" font-weight="normal" text-anchor="middle">NDVI → 녹시율 GVI</text>
<rect x="600.0" y="112" width="250" height="90" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.6"/>
<text x="725.0" y="140" font-size="15" fill="#111827" font-weight="bold" text-anchor="middle">기상 (관측소 / Open-Meteo)</text>
<text x="725.0" y="165.0" font-size="13" fill="#4B5563" font-weight="normal" text-anchor="middle">기온 Ta · 습도 RH · 풍속 v</text>
<rect x="870.0" y="112" width="250" height="90" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.6"/>
<text x="995.0" y="140" font-size="15" fill="#111827" font-weight="bold" text-anchor="middle">시각 · 좌표</text>
<text x="995.0" y="165.0" font-size="13" fill="#4B5563" font-weight="normal" text-anchor="middle">태양고도 · 방위</text>
<rect x="120" y="262" width="940" height="120" rx="10" fill="#E8F0F8" stroke="#2F5D8A" stroke-width="2"/>
<circle cx="150" cy="288" r="13" fill="#2F5D8A"/>
<text x="150" y="293" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<text x="172" y="293" font-size="16" fill="#2F5D8A" font-weight="bold" text-anchor="start">물리 엔진 — 동네를 가리지 않는 전이의 뼈대</text>
<rect x="150.0" y="314" width="190" height="50" rx="8" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/>
<text x="245.0" y="345" font-size="14" fill="#2F5D8A" font-weight="bold" text-anchor="middle">일사 추정</text>
<line x1="344.0" y1="339" x2="376.0" y2="339" stroke="#2F5D8A" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="380.0" y="314" width="190" height="50" rx="8" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/>
<text x="475.0" y="336" font-size="14" fill="#2F5D8A" font-weight="bold" text-anchor="middle">지면·벽 온도</text>
<text x="475.0" y="354" font-size="12" fill="#4B5563" font-weight="normal" text-anchor="middle">(열관성 · 재질)</text>
<line x1="574.0" y1="339" x2="606.0" y2="339" stroke="#2F5D8A" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="610.0" y="314" width="190" height="50" rx="8" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/>
<text x="705.0" y="345" font-size="14" fill="#2F5D8A" font-weight="bold" text-anchor="middle">6방향 복사 → MRT</text>
<line x1="804.0" y1="339" x2="836.0" y2="339" stroke="#2F5D8A" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="840.0" y="314" width="190" height="50" rx="8" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/>
<text x="935.0" y="345" font-size="14" fill="#2F5D8A" font-weight="bold" text-anchor="middle">PET_phys</text>
<line x1="185.0" y1="202" x2="185.0" y2="258" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="455.0" y1="202" x2="455.0" y2="258" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="725.0" y1="202" x2="725.0" y2="258" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="995.0" y1="202" x2="995.0" y2="258" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="120" y="430" width="600" height="150" rx="10" fill="#FEF0E7" stroke="#C2410C" stroke-width="2"/>
<circle cx="150" cy="456" r="13" fill="#C2410C"/>
<text x="150" y="461" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text>
<text x="172" y="461" font-size="16" fill="#C2410C" font-weight="bold" text-anchor="start">잔차 AI — 물리가 놓친 만큼만 학습</text>
<text x="150" y="492.0" font-size="13" fill="#111827" font-weight="normal" text-anchor="start">ΔPET = f( 볕, SVF, GVI, Ta, RH, v, 태양고도, MRT, PET_phys, NDVI )</text>
<text x="150" y="510.85" font-size="13" fill="#111827" font-weight="normal" text-anchor="start">Ridge 회귀 · 표준화 계수 10개 (해석 가능)</text>
<text x="150" y="529.7" font-size="13" fill="#111827" font-weight="normal" text-anchor="start">학습 정답: 걸어서 잰 실측 PET − PET_phys (부산 5근린 80점)</text>
<text x="150" y="548.55" font-size="13" fill="#111827" font-weight="normal" text-anchor="start">피처에 좌표 없음 → 장소가 아니라 형태로 일반화</text>
<rect x="760" y="430" width="300" height="150" rx="10" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="910" y="460" font-size="15" fill="#C2410C" font-weight="bold" text-anchor="middle">확신도 c ∈ [0, 1]</text>
<text x="910" y="488.0" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">학습에서 본 형태와의 거리(표준화 z)</text>
<text x="910" y="506.125" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">가까우면 c = 1, 멀수록 c ↓</text>
<text x="910" y="524.25" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">터무니없는 외삽만 c = 0</text>
<text x="910" y="542.375" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">→ 안 가본 골목도 형태가 같으면 보정</text>
<line x1="590.0" y1="386" x2="590.0" y2="426" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M 590.0 406 L 420 406 L 420 426" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M 590.0 406 L 910 406 L 910 426" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="598.0" y="400" font-size="12" fill="#4B5563" font-weight="normal" text-anchor="start">PET_phys · MRT · 입력 피처</text>
<rect x="300" y="630" width="580" height="64" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<circle cx="330" cy="662" r="13" fill="#4B5563"/>
<text x="330" y="667" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
<text x="590" y="660" font-size="18" fill="#111827" font-weight="bold" text-anchor="middle">PET = PET_phys + c · ΔPET</text>
<text x="590" y="682" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">c가 작을수록 물리 값으로 수렴 — 끄는 것이 아니라 줄이는 것</text>
<line x1="420" y1="584" x2="420" y2="626" stroke="#C2410C" stroke-width="1.8" marker-end="url(#ar_ai)"/>
<line x1="910" y1="584" x2="910" y2="626" stroke="#C2410C" stroke-width="1.8" marker-end="url(#ar_ai)" stroke-dasharray="5 4"/>
<text x="432" y="605" font-size="12" fill="#C2410C" font-weight="normal" text-anchor="start">ΔPET</text>
<text x="922" y="605" font-size="12" fill="#C2410C" font-weight="normal" text-anchor="start">c</text>
<rect x="120" y="740" width="940" height="80" rx="10" fill="#EAF5EC" stroke="#15803D" stroke-width="2"/>
<circle cx="150" cy="766" r="13" fill="#15803D"/>
<text x="150" y="771" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text>
<text x="172" y="771" font-size="16" fill="#15803D" font-weight="bold" text-anchor="start">출력 — 숫자가 아니라 행동</text>
<text x="330" y="800" font-size="14" fill="#15803D" font-weight="bold" text-anchor="middle">위험 등급 (극심 / 주의 / 안전)</text>
<text x="505" y="800" font-size="14" fill="#4B5563" font-weight="normal" text-anchor="middle">→</text>
<text x="660" y="800" font-size="14" fill="#15803D" font-weight="bold" text-anchor="middle">언제 나갈까 · 어느 길로 · 어디서 쉴까</text>
<text x="845" y="800" font-size="14" fill="#4B5563" font-weight="normal" text-anchor="middle">→</text>
<text x="960" y="800" font-size="14" fill="#15803D" font-weight="bold" text-anchor="middle">앱 · 지자체 돌봄 채널</text>
<line x1="590" y1="698" x2="590" y2="736" stroke="#15803D" stroke-width="1.8" marker-end="url(#ar)"/>
</svg>