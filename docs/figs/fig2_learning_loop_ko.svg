<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" font-family="'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ar_ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs>
<rect width="1180" height="620" fill="#FFFFFF"/>
<text x="590.0" y="40" font-size="20" fill="#111827" font-weight="bold" text-anchor="middle">학습 · 검증 · 확장 순환 — AI는 예측기이자 물리의 진단기</text>
<rect x="30.0" y="110" width="200" height="120" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="130.0" y="140" font-size="16" fill="#6B7280" font-weight="bold" text-anchor="middle">걸어서 실측</text>
<text x="130.0" y="168.0" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">흑구 · 열화상 · 360° 카메라</text>
<text x="130.0" y="186.125" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">5근린 80점 (골목 포함)</text>
<text x="130.0" y="204.25" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">정답 PET · Tmrt · Ts</text>
<line x1="234.0" y1="170.0" x2="256.0" y2="170.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="260.0" y="110" width="200" height="120" rx="10" fill="#E8F0F8" stroke="#2F5D8A" stroke-width="2"/>
<text x="360.0" y="140" font-size="16" fill="#2F5D8A" font-weight="bold" text-anchor="middle">엔진 소급 실행</text>
<text x="360.0" y="168.0" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">같은 좌표·시각·기상으로</text>
<text x="360.0" y="186.125" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">PET_phys 산출</text>
<text x="360.0" y="204.25" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">잔차 = 실측 − PET_phys</text>
<line x1="464.0" y1="170.0" x2="486.0" y2="170.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="490.0" y="110" width="200" height="120" rx="10" fill="#FEF0E7" stroke="#C2410C" stroke-width="2"/>
<text x="590.0" y="140" font-size="16" fill="#C2410C" font-weight="bold" text-anchor="middle">잔차 학습</text>
<text x="590.0" y="168.0" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">Ridge, 피처 10개</text>
<text x="590.0" y="186.125" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">(스트리트뷰 무관)</text>
<text x="590.0" y="204.25" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">확신도 함수 c 정의</text>
<line x1="694.0" y1="170.0" x2="716.0" y2="170.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="720.0" y="110" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<text x="820.0" y="140" font-size="16" fill="#4B5563" font-weight="bold" text-anchor="middle">근린 LOSO 검증</text>
<text x="820.0" y="168.0" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">5근린 중 1개 빼고 학습 →</text>
<text x="820.0" y="186.125" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">뺀 근린에서 시험 × 5</text>
<text x="820.0" y="204.25" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">전체 / 커버리지 내 / 골목 보고</text>
<line x1="924.0" y1="170.0" x2="946.0" y2="170.0" stroke="#374151" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="950.0" y="110" width="200" height="120" rx="10" fill="#FEF0E7" stroke="#C2410C" stroke-width="2"/>
<text x="1050.0" y="140" font-size="16" fill="#C2410C" font-weight="bold" text-anchor="middle">계수 해석</text>
<text x="1050.0" y="168.0" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">어느 형태에서 틀리나</text>
<text x="1050.0" y="186.125" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">→ 물리 결함 진단</text>
<text x="1050.0" y="204.25" font-size="12.5" fill="#4B5563" font-weight="normal" text-anchor="middle">예: 그늘 지면 열관성</text>
<rect x="630.0" y="262" width="380" height="118" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="642.0" y="286" font-size="12.5" fill="#4B5563" font-weight="bold" text-anchor="start">비교 (근린 LOSO, n=80)</text>
<text x="865.0" y="286" font-size="12.5" fill="#4B5563" font-weight="bold" text-anchor="middle">R²</text>
<text x="935.0" y="286" font-size="12.5" fill="#4B5563" font-weight="bold" text-anchor="middle">MAE</text>
<text x="990.0" y="286" font-size="12.5" fill="#4B5563" font-weight="bold" text-anchor="middle">극심</text>
<text x="642.0" y="310" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start">순수 ML  F0~F3</text>
<text x="865.0" y="310" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle">&lt; 0</text>
<text x="935.0" y="310" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle">3.5~4.9</text>
<text x="990.0" y="310" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle">—</text>
<text x="642.0" y="334" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="start">물리 단독</text>
<text x="865.0" y="334" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle">−0.14</text>
<text x="935.0" y="334" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle">3.50</text>
<text x="990.0" y="334" font-size="12.5" fill="#111827" font-weight="normal" text-anchor="middle">57/63</text>
<text x="642.0" y="358" font-size="12.5" fill="#C2410C" font-weight="bold" text-anchor="start">물리 + 잔차 AI</text>
<text x="865.0" y="358" font-size="12.5" fill="#C2410C" font-weight="bold" text-anchor="middle">0.33~0.48</text>
<text x="935.0" y="358" font-size="12.5" fill="#C2410C" font-weight="bold" text-anchor="middle">2.4~2.7</text>
<text x="990.0" y="358" font-size="12.5" fill="#C2410C" font-weight="bold" text-anchor="middle">63/63</text>
<line x1="820.0" y1="234" x2="820.0" y2="258" stroke="#4B5563" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="230.0" y="470" width="260" height="70" rx="10" fill="#E8F0F8" stroke="#2F5D8A" stroke-width="2"/>
<text x="360.0" y="498" font-size="15" fill="#2F5D8A" font-weight="bold" text-anchor="middle">물리 엔진 수정</text>
<text x="360.0" y="520" font-size="12" fill="#4B5563" font-weight="normal" text-anchor="middle">그늘 지면 열관성 0.74 · 현장풍속 이중감쇠 제거</text>
<path d="M 1050.0 234 L 1050.0 505 L 494.0 505" fill="none" stroke="#2F5D8A" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="1038.0" y="492" font-size="12" fill="#2F5D8A" font-weight="normal" text-anchor="end">물리 결함 → 물리로 돌려보냄</text>
<path d="M 360.0 466 L 360.0 234" fill="none" stroke="#2F5D8A" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="370.0" y="390.0" font-size="12" fill="#2F5D8A" font-weight="normal" text-anchor="start">재학습</text>
<text x="370.0" y="408.0" font-size="11.5" fill="#4B5563" font-weight="normal" text-anchor="start">(볕 계수 −0.42 → +0.04:</text>
<text x="370.0" y="424.0" font-size="11.5" fill="#4B5563" font-weight="normal" text-anchor="start">그늘 잔차가 물리로 흡수)</text>
<rect x="30.0" y="470" width="200" height="70" rx="10" fill="#FEF0E7" stroke="#C2410C" stroke-width="2" stroke-dasharray="6 4"/>
<text x="130.0" y="498" font-size="15" fill="#C2410C" font-weight="bold" text-anchor="middle">저확신 형태 지도</text>
<text x="130.0" y="520" font-size="12" fill="#4B5563" font-weight="normal" text-anchor="middle">좁은 골목 · 아침/저녁 → 다음 실측</text>
<path d="M 590.0 234 L 590.0 560 L 130.0 560 L 130.0 544" fill="none" stroke="#C2410C" stroke-width="1.8" marker-end="url(#ar_ai)" stroke-dasharray="5 4"/>
<text x="600.0" y="556" font-size="12" fill="#C2410C" font-weight="normal" text-anchor="start">c 낮은 형태 = 데이터 없는 곳 = 취약층 골목</text>
<path d="M 130.0 466 L 130.0 234" fill="none" stroke="#C2410C" stroke-width="1.8" marker-end="url(#ar_ai)"/>
<text x="140.0" y="390.0" font-size="12" fill="#C2410C" font-weight="normal" text-anchor="start">걸어가서 채움</text>
</svg>